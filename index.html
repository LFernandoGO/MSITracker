<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MSI Tracker</title>

    <link rel="icon" type="image/png" href="favicon.png" />

    <link rel="stylesheet" href="./css/styles.css" />

</head>

<body data-theme="dusk">

    <!-- THEME PANEL -->
    <div id="themePanel" class="theme-panel"></div>

    <!-- HEADER -->
    <header class="header">

        <div class="header-top">

            <div class="logo">
                MSI <em>Tracker</em>
            </div>

            <div class="header-chips">

                <div class="hchip hchip-blue" id="hchipTarjeta">
                    $0
                    <span>tarjeta</span>
                </div>

                <div class="hchip hchip-green" id="hchipMio">
                    $0
                    <span>mi parte</span>
                </div>

                <div class="hchip hchip-red" id="hchipDeben">
                    $0
                    <span>me deben</span>
                </div>

                <button id="themeButton" class="theme-btn">
                    🎨
                </button>

            </div>

        </div>

        <div class="header-sub" id="headerSub"></div>

    </header>

    <!-- SYNC -->
    <div class="sync-bar">

        <div class="sync-dot syncing" id="syncDot"></div>

        <span id="syncText">
            Conectando...
        </span>

    </div>

    <!-- TABS -->
    <nav class="tabs" id="tabs"></nav>

    <!-- APP -->
    <main id="app"></main>

    <!-- MODALS -->
    <div id="modalRoot"></div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- FAB -->
    <button class="fab" id="fab">
        +
    </button>

    <!-- CONFIG -->
    <script src="./js/config.js"></script>

    <!-- APP -->
    <script type="module" src="./js/app.js"></script>

</body>

</html>
